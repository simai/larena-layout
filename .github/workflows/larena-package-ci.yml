name: Larena Package CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Checkout Larena path dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          php -r '$c=json_decode(file_get_contents("composer.json"), true); foreach ($c["repositories"] ?? [] as $r) { $u=$r["url"] ?? ""; if (($r["type"] ?? "") === "path" && preg_match("#^\.\./[a-z0-9-]+$#", $u)) echo $u, PHP_EOL; }' |
          while IFS= read -r target; do
            package="$(basename "$target")"
            gh repo clone "simai/larena-${package}" "$target" -- --depth 1
          done
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer run quality:gate
